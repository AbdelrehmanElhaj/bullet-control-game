<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Bullet Control</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0a0a0f; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: monospace; }
canvas { display: block; max-width: 100vw; max-height: 70vh; border-radius: 8px; touch-action: none; }
#ui { display: flex; align-items: center; gap: 16px; padding: 8px 4px; font-size: 13px; color: #aaa; flex-wrap: wrap; width: 100%; max-width: 660px; }
#ui span { font-weight: 700; color: #eee; }
#restart { font-size: 12px; padding: 4px 12px; background: transparent; border: 1px solid #555; color: #eee; border-radius: 6px; cursor: pointer; margin-left: auto; }
.heart { color: #E24B4A; }
#dpad { display: flex; flex-direction: column; align-items: center; gap: 4px; position: fixed; bottom: 24px; left: 24px; }
#dpad-row { display: flex; gap: 4px; }
.dpad-btn { width: 52px; height: 52px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; font-size: 20px; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-user-select: none; active: background: rgba(255,255,255,0.25); }
.dpad-btn:active { background: rgba(255,255,255,0.25); }
#fire-btn { position: fixed; bottom: 24px; right: 24px; width: 72px; height: 72px; background: rgba(46,204,113,0.25); border: 2px solid #2ecc71; border-radius: 50%; font-size: 13px; font-weight: 700; color: #2ecc71; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-user-select: none; letter-spacing: 0.5px; }
#fire-btn:active { background: rgba(46,204,113,0.5); }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="ui">
  <div>Lives: <span id="lives-bar"></span></div>
  <div>Score: <span id="score">0</span></div>
  <div>Wave: <span id="wave">1</span></div>
  <button id="restart" style="display:none">Restart</button>
</div>

<div id="dpad">
  <div class="dpad-btn" id="btn-up">▲</div>
  <div id="dpad-row">
    <div class="dpad-btn" id="btn-left">◀</div>
    <div class="dpad-btn" style="background:transparent;border:none"></div>
    <div class="dpad-btn" id="btn-right">▶</div>
  </div>
  <div class="dpad-btn" id="btn-down">▼</div>
</div>
<div id="fire-btn">FIRE</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');

function resize() {
  const maxW = Math.min(window.innerWidth, 660);
  const maxH = Math.min(window.innerHeight * 0.65, 420);
  const ratio = 660 / 420;
  let w = maxW, h = maxW / ratio;
  if (h > maxH) { h = maxH; w = h * ratio; }
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
resize();
window.addEventListener('resize', resize);

const W = 660, H = 420;
canvas.width = W; canvas.height = H;

let keys = {};
let state;

function initState() {
  return {
    phase: 'aiming', bullet: null, enemies: [], enemyBullets: [],
    particles: [], score: 0, wave: 1, lives: 3,
    shooterX: 40, shooterY: H / 2, aimAngle: 0,
    shootCooldown: 0, gameOver: false, waveTransition: 0,
  };
}

function spawnWave(s) {
  s.enemies = [];
  const count = 2 + s.wave;
  for (let i = 0; i < count; i++) {
    const row = Math.floor(i / 3), col = i % 3;
    s.enemies.push({
      x: W - 100 - col * 90, y: 80 + row * 110 + (col % 2) * 40,
      w: 28, h: 28, hp: 1 + Math.floor(s.wave / 3),
      maxHp: 1 + Math.floor(s.wave / 3),
      shootTimer: 60 + Math.random() * 80,
      shootInterval: 90 + Math.random() * 60 - s.wave * 5,
      angle: Math.PI, aimOscillate: Math.random() * Math.PI * 2,
      aimSpeed: 0.02 + Math.random() * 0.02, flash: 0,
    });
  }
}

state = initState();
spawnWave(state);
updateHud();

document.addEventListener('keydown', e => { keys[e.key] = true; });
document.addEventListener('keyup', e => { keys[e.key] = false; });

function setupDpad(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; }, { passive: false });
  el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; }, { passive: false });
  el.addEventListener('mousedown', () => keys[key] = true);
  el.addEventListener('mouseup', () => keys[key] = false);
}
setupDpad('btn-up', 'ArrowUp');
setupDpad('btn-down', 'ArrowDown');
setupDpad('btn-left', 'ArrowLeft');
setupDpad('btn-right', 'ArrowRight');

const fireBtn = document.getElementById('fire-btn');
fireBtn.addEventListener('touchstart', e => { e.preventDefault(); keys[' '] = true; }, { passive: false });
fireBtn.addEventListener('touchend', e => { e.preventDefault(); keys[' '] = false; }, { passive: false });
fireBtn.addEventListener('mousedown', () => keys[' '] = true);
fireBtn.addEventListener('mouseup', () => keys[' '] = false);

document.getElementById('restart').addEventListener('click', () => {
  state = initState(); spawnWave(state); updateHud();
  document.getElementById('restart').style.display = 'none';
});

function fireBullet(s) {
  s.phase = 'flying';
  s.bullet = { x: s.shooterX + 20, y: s.shooterY, vx: Math.cos(s.aimAngle)*6, vy: Math.sin(s.aimAngle)*6, trail: [], alive: true };
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, spd = 1.5 + Math.random() * 3;
    state.particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, life: 1, color });
  }
}

function updateEnemies(s, tx, ty) {
  s.enemies.forEach(e => {
    e.aimOscillate += e.aimSpeed;
    e.angle = Math.PI + Math.sin(e.aimOscillate) * 0.6;
    if (e.flash > 0) e.flash--;
    e.shootTimer--;
    if (e.shootTimer <= 0) {
      const a = Math.atan2(ty - e.y, tx - e.x);
      s.enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*4.5, vy: Math.sin(a)*4.5 });
      e.shootTimer = Math.max(40, e.shootInterval - s.wave * 3);
      e.flash = 8;
    }
  });
}

function update(s) {
  if (s.gameOver) return;
  s.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.03; });
  s.particles = s.particles.filter(p => p.life > 0);

  if (s.waveTransition > 0) {
    s.waveTransition--;
    if (s.waveTransition === 0) { s.wave++; spawnWave(s); s.phase = 'aiming'; s.bullet = null; }
    return;
  }

  if (s.phase === 'aiming') {
    if (keys['ArrowUp'] || keys['w']) s.aimAngle -= 0.04;
    if (keys['ArrowDown'] || keys['s']) s.aimAngle += 0.04;
    s.aimAngle = Math.max(-Math.PI * 0.45, Math.min(Math.PI * 0.45, s.aimAngle));
    if ((keys[' '] || keys['ArrowRight'] || keys['d']) && s.shootCooldown <= 0) fireBullet(s);
    if (s.shootCooldown > 0) s.shootCooldown--;
    updateEnemies(s, s.shooterX, s.shooterY);
    s.enemyBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
    s.enemyBullets = s.enemyBullets.filter(b => b.x>0&&b.x<W&&b.y>0&&b.y<H);
    s.enemyBullets.forEach((b, bi) => {
      const dx = b.x - s.shooterX, dy = b.y - s.shooterY;
      if (Math.sqrt(dx*dx+dy*dy) < 18) {
        s.enemyBullets.splice(bi, 1); s.lives--;
        spawnParticles(s.shooterX, s.shooterY, '#E24B4A', 12);
        if (s.lives <= 0) { s.gameOver = true; document.getElementById('restart').style.display = ''; }
        updateHud();
      }
    });
  } else if (s.phase === 'flying') {
    const b = s.bullet;
    if (!b || !b.alive) { s.phase = 'aiming'; s.shootCooldown = 30; return; }
    if (keys['ArrowUp'] || keys['w']) b.vy -= 0.18;
    if (keys['ArrowDown'] || keys['s']) b.vy += 0.18;
    if (keys['ArrowLeft'] || keys['a']) b.vx -= 0.1;
    if (keys['ArrowRight'] || keys['d']) b.vx += 0.1;
    const spd = Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if (spd > 9) { b.vx = b.vx/spd*9; b.vy = b.vy/spd*9; }
    if (spd < 3) { b.vx *= 3/spd; b.vy *= 3/spd; }
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 18) b.trail.shift();
    b.x += b.vx; b.y += b.vy;
    if (b.x>W||b.x<0||b.y<0||b.y>H) { b.alive=false; s.phase='aiming'; s.shootCooldown=30; return; }
    s.enemies.forEach((e, ei) => {
      if (!b.alive) return;
      if (b.x>e.x-e.w&&b.x<e.x+e.w&&b.y>e.y-e.h&&b.y<e.y+e.h) {
        e.hp--; spawnParticles(b.x, b.y, '#E24B4A', 8);
        b.alive=false; s.phase='aiming'; s.shootCooldown=20;
        if (e.hp<=0) { spawnParticles(e.x, e.y, '#E24B4A', 20); s.enemies.splice(ei,1); s.score+=100*s.wave; updateHud(); }
      }
    });
    updateEnemies(s, b.x, b.y);
    s.enemyBullets.forEach(eb => { eb.x += eb.vx; eb.y += eb.vy; });
    s.enemyBullets = s.enemyBullets.filter(eb => eb.x>0&&eb.x<W&&eb.y>0&&eb.y<H);
    s.enemyBullets.forEach((eb, bi) => {
      if (!b||!b.alive) return;
      const dx=eb.x-b.x, dy=eb.y-b.y;
      if (Math.sqrt(dx*dx+dy*dy)<10) {
        s.enemyBullets.splice(bi,1); spawnParticles(b.x,b.y,'#FAC775',8);
        b.alive=false; s.phase='aiming'; s.shootCooldown=30;
      }
    });
    if (s.enemies.length===0) { s.waveTransition=90; s.enemyBullets=[]; s.bullet=null; s.phase='aiming'; }
  }
}

function draw(s) {
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,W,H);
  for (let i=0;i<60;i++) {
    const sx=(i*137+11)%W, sy=(i*97+23)%H;
    ctx.fillStyle=`rgba(255,255,255,${0.05+(i%5)*0.02})`; ctx.fillRect(sx,sy,1,1);
  }
  s.particles.forEach(p => { ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.fillRect(p.x-2,p.y-2,4,4); });
  ctx.globalAlpha=1;
  s.enemyBullets.forEach(b => {
    ctx.fillStyle='#E24B4A'; ctx.beginPath(); ctx.arc(b.x,b.y,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(226,75,74,0.3)'; ctx.beginPath(); ctx.arc(b.x,b.y,7,0,Math.PI*2); ctx.fill();
  });
  if (s.bullet&&s.bullet.alive) {
    s.bullet.trail.forEach((t,i) => {
      ctx.globalAlpha=(i/s.bullet.trail.length)*0.6; ctx.fillStyle='#FAC775';
      const r=2+(i/s.bullet.trail.length)*2; ctx.fillRect(t.x-r/2,t.y-r/2,r,r);
    });
    ctx.globalAlpha=1; ctx.fillStyle='#FAC775'; ctx.beginPath(); ctx.arc(s.bullet.x,s.bullet.y,5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#EF9F27'; ctx.lineWidth=1.5; ctx.stroke();
  }
  s.enemies.forEach(e => {
    ctx.fillStyle=e.flash>0?'#ff6b6b':'#c0392b'; ctx.fillRect(e.x-e.w,e.y-e.h,e.w*2,e.h*2);
    ctx.strokeStyle=e.flash>0?'#ff9999':'#922b21'; ctx.lineWidth=1.5; ctx.strokeRect(e.x-e.w,e.y-e.h,e.w*2,e.h*2);
    if (e.maxHp>1) {
      ctx.fillStyle='#444'; ctx.fillRect(e.x-e.w,e.y+e.h+3,e.w*2,4);
      ctx.fillStyle='#E24B4A'; ctx.fillRect(e.x-e.w,e.y+e.h+3,e.w*2*(e.hp/e.maxHp),4);
    }
    ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(e.angle);
    ctx.fillStyle='#7f8c8d'; ctx.fillRect(0,-3,24,6);
    ctx.fillStyle='#95a5a6'; ctx.fillRect(18,-2,8,4);
    ctx.restore();
    ctx.fillStyle='#e8e8e8'; ctx.font='bold 11px monospace'; ctx.textAlign='center'; ctx.fillText('!',e.x,e.y+5);
  });
  ctx.save(); ctx.translate(s.shooterX,s.shooterY);
  ctx.fillStyle='#2ecc71'; ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#27ae60'; ctx.lineWidth=2; ctx.stroke();
  ctx.rotate(s.aimAngle);
  ctx.fillStyle='#bdc3c7'; ctx.fillRect(10,-4,22,8);
  ctx.fillStyle='#95a5a6'; ctx.fillRect(28,-3,8,6);
  ctx.restore();
  if (s.phase==='aiming') {
    ctx.save(); ctx.translate(s.shooterX,s.shooterY); ctx.rotate(s.aimAngle);
    ctx.setLineDash([4,6]); ctx.strokeStyle='rgba(46,204,113,0.4)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(32,0); ctx.lineTo(160,0); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  }
  if (s.waveTransition>0) {
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#2ecc71'; ctx.font='bold 28px monospace'; ctx.textAlign='center'; ctx.fillText('Wave cleared!',W/2,H/2-10);
    ctx.fillStyle='#aaa'; ctx.font='16px monospace'; ctx.fillText(`Wave ${s.wave+1} incoming...`,W/2,H/2+20);
  }
  if (s.gameOver) {
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#E24B4A'; ctx.font='bold 32px monospace'; ctx.textAlign='center'; ctx.fillText('Game Over',W/2,H/2-20);
    ctx.fillStyle='#aaa'; ctx.font='16px monospace'; ctx.fillText(`Score: ${s.score}`,W/2,H/2+14);
  }
}

function updateHud() {
  document.getElementById('lives-bar').innerHTML =
    Array.from({length:state.lives},()=>'<span class="heart">&#9829;</span>').join('')+
    Array.from({length:Math.max(0,3-state.lives)},()=>'<span style="color:#333">&#9825;</span>').join('');
  document.getElementById('score').textContent=state.score;
  document.getElementById('wave').textContent=state.wave;
}

function loop() { update(state); draw(state); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
